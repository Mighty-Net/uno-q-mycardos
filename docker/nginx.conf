server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;


    root /usr/share/nginx/html;
    index index.html;

    # Camera Stream
    location /stream {
        proxy_pass http://ffmpeg:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Vision API
    location /api/vision/ {
        proxy_pass http://mycard-vision:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MCU API
    location /api/mcu/ {
        proxy_pass http://unix:/runtime/mcu.sock:/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React
    location / {
        try_files $uri $uri/ /index.html;
    }
}